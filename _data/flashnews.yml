# url: /
# status: info
# author: HPC Team
# date: 2022-09-28
# motd: true
# title: Since September 15, only ~70% of the NEMO cluster is available (625 nodes).
# text: >
#   We have received instructions from the University of Freiburg to save 30% of the power consumption.
#   To achieve this, we have shut down about 30% of the NEMO nodes.
#   Currently, about 625 nodes are available (~70% of all available nodes).
#   <br />
#   Update 05.10.2022: You can check the usage of your group with <code>nemorvusage</code>.
# ---

# ---
# url: /
# status: danger
# author: HPC Team Freiburg
# date: 2022-08-03
# motd: true
# title: Cooling System Heat Problem
# text: >
#   Due to the hot temperatures in the next days, we have to gradually reduce the load on the cooling system.
#   Therefore, we will shut down the NEMO machines in the next few days after finishing a job.
#   No jobs will be canceled (unless the cooling fails in the meantime), but the waiting times in the queue will probably increase drastically.
#   After the maintenance on 08.08. we will see how many nodes we can start up again.
# ---

